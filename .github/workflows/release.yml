name: Release

on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Set up Bun for the build
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Set up Node.js for npm commands
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: bun install

      - name: Check & Test
        run: |
          bun run check
          bun run test

      - name: Build
        run: bun run build

      - name: Verify npm package
        run: bun run verify:package

      # Publish with provenance using OIDC; no npm secret is required
      - name: Publish to NPM
        run: npm publish
